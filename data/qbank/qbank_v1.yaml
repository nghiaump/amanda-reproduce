# Question bank v1 — đồ thị câu hỏi đọc phim, trích từ tài liệu tiếng Việt (kho tri thức bsnt), dịch sang tiếng Anh.
#
# Thay cho 3 tầng câu hỏi tự do của Explorer (AMANDA §3.3, Table 12). GIỮ khung 3 tầng của bài báo:
#   tier 1 = General observation · tier 2 = Anatomical analysis · tier 3 = Detailed findings
# Cấu trúc đồ thị: route (phương thức × vùng) → root → structure (tầng 2) → finding (tầng 3). Cạnh `refines` = `parent`.
# Câu hỏi tầng 1 gắn vào root; tầng 2 gắn vào structure; tầng 3 gắn vào finding hoặc descriptor.
#
# Nguồn: `source:doc_id#ord` = bảng source/document/chunk của Postgres bsnt (repo ~/ai/bsnt-study), đọc read-only
# bằng scripts/qbank_extract.py. Người dùng xác nhận quyền dùng cho seminar học thuật (24/09).
# ⛔ Dựng CHỈ từ tài liệu, không nhìn câu hỏi test của SLAKE. ⛔ Mọi mục cần thông tin NGOÀI một ảnh đơn bị loại
#    (xem `excluded` cuối file và docs/repro/qbank_sources.md).
# `derived: true` = không có hướng dẫn đọc phim riêng cho route đó; câu hỏi được SUY RA từ nguồn gần nhất.

version: qbank_v1

sources:
  "bsnt:2755":      {title: "Checklist kiểm tra đọc X quang ngực", author: "TS.BS Lê Thượng Vũ", org: "ĐHYD TP.HCM, Nội khoa Y4 2025–26"}
  "bsnt:2758":      {title: "Checklist đọc X-quang ngực thẳng trong tim mạch", author: "", org: "Kho ôn thi BSNT — ĐHYD TP.HCM"}
  "lectures:10925": {title: "Đọc X quang phổi — các bước ABCDEF", author: "TS.BS Đỗ Thị Tường Oanh", org: "ĐH Y khoa Phạm Ngọc Thạch"}
  "lectures:11747": {title: "Phân tích phim X quang ngực", author: "ThS.BS Trần Thị Thúy Tường", org: "Bộ môn Nội, ĐHYD TP.HCM"}
  "lectures:11334": {title: "Form đọc X quang", author: "", org: "BV Nhi Đồng 2 — Bộ môn Nhi"}
  "lectures:13575": {title: "Bảng kiểm đọc X quang phổi (trạm OSCE)", author: "", org: ""}
  "lectures:8244":  {title: "CT ngực — CLS hè 2020", author: "ThS.BS Hoàng Đình Dương", org: "ĐH Y khoa Phạm Ngọc Thạch"}
  "yhoc8003:26093": {title: "Cách đọc CT ngực", author: "BS Nguyễn Quý Khoáng, BS Nguyễn Quang Trọng", org: ""}
  "lectures:9222":  {title: "CT bụng — cách đọc CT bụng chậu", author: "TS.BS Nghiêm Phương Thảo", org: "Bộ môn CĐHA, ĐH Y khoa Phạm Ngọc Thạch"}
  "lectures:14709": {title: "Bảng kiểm — Rèn luyện đọc phim CT-scan bụng cơ bản", author: "", org: "CLB Ngoại khoa Trưng Vương, ĐH Y khoa Phạm Ngọc Thạch"}
  "yhoc8003:21719": {title: "CT sọ não (đọc phim CT đầu — ABBCS)", author: "ThS.BS Nguyễn Minh Đức", org: ""}
  "lectures:8722":  {title: "Tiếp cận CT sọ não", author: "BS Nguyễn Minh Đức", org: ""}
  "yhoc8003:20239": {title: "Hình ảnh học cấp cứu — CT sọ não", author: "ThS.BS Nguyễn Minh Đức", org: ""}
  "lectures:14262": {title: "Hình ảnh CT trong đột quỵ", author: "BS Nguyễn Thị Tuyên Trân", org: ""}
  "lectures:15498": {title: "Hình ảnh học đột quỵ", author: "BS Nguyễn Thị Tuyên Trân", org: ""}
  "lectures:14738": {title: "MRI lý thuyết", author: "", org: "ĐHYD TP.HCM, CĐHA Y3"}
  "yhoc8003:21056": {title: "Giải phẫu cắt lớp CT-MRI, T1 — Phần đầu-cổ", author: "", org: ""}

# route = "<modality>_<region>". Router (LLM, từ caption + câu hỏi) trả modality ∈ {xray, ct, mri} và
# region ∈ {chest, abdomen_pelvis, head, neck}; tổ hợp không có route riêng đi qua `aliases`, còn lại → generic.
routes:
  xray_chest:        {derived: false}
  ct_chest:          {derived: false}
  ct_abdomen_pelvis: {derived: false}
  ct_head:           {derived: false}
  mri_head:          {derived: true}
  ct_neck:           {derived: true}
  generic:           {derived: true}
aliases:
  mri_abdomen_pelvis: ct_abdomen_pelvis
  mri_chest: ct_chest
  mri_neck: ct_neck
  xray_abdomen_pelvis: generic
  xray_head: generic
  xray_neck: generic

