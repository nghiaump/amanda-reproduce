  - id: cc.s.wall
    node: cc.wall
    tier: 2
    vi_src: "Tuyến giáp: kích thước, đậm độ; Thành ngực: mô mềm, tuyến vú; Thực quản"
    src: "lectures:8244#2"
    en_open: "Are the chest wall, breasts, thyroid and oesophagus normal?"
