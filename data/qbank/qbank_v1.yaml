# Mục có trong nguồn nhưng BỊ LOẠI — cần thông tin ngoài một ảnh đơn (bài học §14: LLaVA-Med bịa câu trả lời).
excluded:
  - {vi_src: "Kiểm tra đúng bệnh nhân, đúng phim (tên, tuổi, thời gian chụp, chụp ở khoa, bệnh viện nào…)", src: "bsnt:2755#0", reason: "thông tin hành chính, không có trong ảnh"}
  - {vi_src: "Xác định về giới tính; Xác định về tuổi; Thời điểm chụp phim", src: "bsnt:2758#0", reason: "thông tin hành chính / không suy ra được tin cậy từ ảnh"}
  - {vi_src: "Đọc cùng với phim nghiêng để thấy chiều không gian", src: "bsnt:2755#0", reason: "cần phim thứ hai"}
  - {vi_src: "So sánh phim cũ để thấy thêm chiều thời gian", src: "bsnt:2755#0", reason: "cần phim cũ"}
  - {vi_src: "Kết hợp lâm sàng để định hướng chẩn đoán", src: "bsnt:2755#0", reason: "cần bệnh sử"}
  - {vi_src: "XEM HÌNH 'SCOUT VIEW' ĐỂ BIẾT VỊ TRÍ LÁT CẮT", src: "yhoc8003:26093#0", reason: "cần ảnh định vị riêng"}
  - {vi_src: "ĐO ĐẬM ĐỘ (TỶ TRỌNG) … BẰNG NÚT 'ROI'", src: "yhoc8003:26093#0", reason: "cần công cụ đo trên máy, ảnh JPG không có HU"}
  - {vi_src: "ĐƯA RA CHẨN ĐOÁN … DỰA VÀO BỆNH SỬ VÀ CÁC TRIỆU CHỨNG LÂM SÀNG HOẶC XÉT NGHIỆM", src: "yhoc8003:26093#0", reason: "cần bệnh sử, xét nghiệm"}
  - {vi_src: "Tiếp cận bệnh nhân — Tiền sử mổ vùng bụng – chậu; Tiền sử bệnh ác tính và xạ trị; Những bất thường trước đây", src: "lectures:9222#1", reason: "cần bệnh sử và phim cũ"}
  - {vi_src: "Xem hình định vị …; Xem trục cột sống cổ cao", src: "yhoc8003:21719#0", reason: "cần ảnh định vị"}
  - {vi_src: "'S' – Xác định cơ chế chấn thương", src: "yhoc8003:21719#1", reason: "cần bệnh sử"}
  - {vi_src: "Hạ phân thùy gan 2–8; Tĩnh mạch mạc treo tràng dưới; Động mạch gan chung …", src: "lectures:14709#0", reason: "bài tập nhận diện giải phẫu mức rất mịn, không phải bước sàng lọc bất thường; giữ ngoài bank để bank không phình"}
  - {vi_src: "Xác định khoảng cách bờ phải bóng tim với bờ phải cột sống; khoảng cách bờ trái cung ĐMC … (các số đo tim mạch)", src: "bsnt:2758#0", reason: "số đo chuyên sâu tim mạch; ảnh SLAKE không có thước đo"}
  - {vi_src: "Giới hạn: DWI/ADC, T1 trước–sau tiêm, so sánh nhiều chuỗi xung", src: "lectures:15498#1", reason: "cần ảnh của chuỗi xung khác — đúng lỗi qid 12779 (ADC map bịa)"}
