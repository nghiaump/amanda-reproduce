    en_open: "Are there degenerative changes or suspicious (metastatic) bone lesions?"
    en_yn: "Is there a suspicious bone lesion?"
  - id: ab.d.lesion
    node: ab.desc
    tier: 3
    vi_src: "Giảm đậm độ (Hypodensity), Đồng đậm độ (Isodensity), Tăng đậm độ (Hyperdensity); Gan 65 +/– 5 HU, Lách 45 +/– 5 HU, Thận 40 +/– 10 HU"
    src: "lectures:8722#0"
    en_open: "Describe the lesion: which organ, its size and shape, and whether it is hypodense, isodense or hyperdense."
    en_yn: "Is the lesion hypodense?"

  # ═════════════ CT SỌ NÃO — ABBCS ═════════════
  - id: hc.t.protocol
    node: hc
    tier: 1
    vi_src: "Đọc phim CT đầu — Thông tin bệnh nhân và protocol (không cản quang/cản quang)"
    src: "yhoc8003:21719#0"
    en_open: "Is this head CT non-contrast or contrast-enhanced?"
    en_yn: "Is this a non-contrast head CT?"
  - id: hc.t.window
    node: hc
    tier: 1
    vi_src: "CỬA SỔ NHU MÔ - CỬA SỔ XƯƠNG"
    src: "yhoc8003:20239#0"
    en_open: "Is this image displayed in a brain (parenchymal) window or a bone window?"
    en_yn: "Is this image displayed in a bone window?"
  - id: hc.t.asym
    node: hc
    tier: 1
    vi_src: "'A' – Asymetry – so sánh hai bên. Lưu ý đầu xoay"
    src: "yhoc8003:21719#1"
    en_open: "Comparing the two sides, is the brain symmetric, or is one side abnormal?"
    en_yn: "Is there an asymmetry between the left and right sides of the brain?"
  - id: hc.s.blood
    node: hc.blood
    tier: 2
    vi_src: "'B' – Blood – xuất huyết, tăng đậm độ. Đánh giá máu toàn bộ hai bán cầu và trong nhu mô; Não thất và khoang dịch não tủy; Rãnh não để tìm xuất huyết dưới nhện"
    src: "yhoc8003:21719#1"
    en_open: "Is there any hyperdense blood in the hemispheres, the parenchyma, the ventricles or the sulci?"
    en_yn: "Is there any hyperdense haemorrhage?"
  - id: hc.s.brain
    node: hc.brain
    tier: 2
    vi_src: "'B' – Brain — Bất thường đậm độ; Di lệch: sự đẩy lệch đường giữa; Sự phân biệt chất xám/trắng"
    src: "yhoc8003:21719#1"
    en_open: "Is the brain parenchyma normal in density, with preserved grey–white differentiation and a midline position?"
    en_yn: "Is there abnormal density in the brain parenchyma?"
  - id: hc.s.csf
    node: hc.csf
    tier: 2
    vi_src: "'C' – CSF spaces – khoang dịch não tủy: Đánh giá kích thước não thất và rãnh não; Các bể bình thường"
    src: "yhoc8003:21719#1"
    en_open: "Are the ventricles, sulci and basal cisterns normal in size?"
    en_yn: "Are the ventricles enlarged?"
  - id: hc.s.skull
    node: hc.skull
    tier: 2
    vi_src: "'S' – Skull and scalp – chấn thương mô mềm; Lưu ý cửa sổ xương"
    src: "yhoc8003:21719#1"
    en_open: "Are the skull and scalp soft tissues intact?"
    en_yn: "Is there an abnormality of the skull or scalp?"
  - id: hc.f.extra
    node: hc.blood.extra
    tier: 3
    vi_src: "EDH: Hình hai mặt lồi (biconvex/lenticular), không vượt qua khớp sọ; SDH: hình liềm"
    src: "yhoc8003:20239#0"
    also: ["lectures:8722#1"]
    en_open: "Is there an extra-axial collection, and is it biconvex (epidural) or crescent-shaped (subdural)?"
    en_yn: "Is there an epidural or subdural haematoma?"
  - id: hc.f.sah
    node: hc.blood.sah
    tier: 3
    vi_src: "XUẤT HUYẾT KHOANG DƯỚI NHỆN — Tăng đậm độ các khe, rãnh não; XUẤT HUYẾT TRONG NÃO THẤT"
    src: "yhoc8003:20239#0"
    en_open: "Are the sulci or ventricles filled with hyperdense material (subarachnoid or intraventricular haemorrhage)?"
    en_yn: "Is there subarachnoid or intraventricular haemorrhage?"
  - id: hc.f.hypo
    node: hc.brain.hypo
    tier: 3
    vi_src: "Giảm đậm độ: phù/nhồi máu, khí và u; Giảm đậm độ theo vùng phân bố mạch máu"
    src: "yhoc8003:21719#1"
    en_open: "Is there a hypodense area, and does it follow a vascular territory (anterior, middle or posterior cerebral artery)?"
    en_yn: "Is there a hypodense area in a vascular territory?"
  - id: hc.f.early
    node: hc.brain.early
    tier: 3
    vi_src: "Dấu 'tăng đậm độ đm não giữa'; Xóa mờ nhân đậu; Mất ranh giới chất xám/trắng do phù; Dấu hiệu 'Ruy băng thùy đảo'; Mất cấu trúc rãnh não bình thường"
    src: "yhoc8003:21719#1"
    en_open: "Are there early ischaemic signs: a hyperdense middle cerebral artery, loss of the insular ribbon, or an obscured lentiform nucleus?"
    en_yn: "Are there early signs of ischaemic stroke?"
  - id: hc.f.shift
    node: hc.brain.shift
    tier: 3
    vi_src: "Di lệch: Sự đẩy lệch Đường giữa; Cấu trúc đường giữa như liềm não…; Hiệu ứng choán chỗ: ép não thất"
    src: "yhoc8003:21719#1"
    en_open: "Is there midline shift or mass effect compressing the ventricles?"
    en_yn: "Is there a midline shift?"
  - id: hc.f.herni
    node: hc.csf.herni
    tier: 3
    vi_src: "Tìm bất đối xứng khoang dịch não tủy như xóa sừng trán hoặc mất rãnh não gợi ý phù; Đánh giá sự xóa bể nền hoặc thoát vị hạnh nhân"
    src: "yhoc8003:21719#1"
    en_open: "Are the sulci or basal cisterns effaced, suggesting oedema or herniation?"
    en_yn: "Are the basal cisterns or sulci effaced?"
  - id: hc.f.fx
    node: hc.skull.fx
    tier: 3
    vi_src: "VỠ HỘP SỌ: Nứt sọ dạng đường, Lún sọ (depressed); cần phân biệt Mạch máu, Khớp sọ"
    src: "yhoc8003:20239#0"
    en_open: "On the bone window, is there a linear or depressed skull fracture (as distinct from a suture or vascular groove)?"
    en_yn: "Is there a skull fracture?"
  - id: hc.d.lesion
    node: hc.desc
    tier: 3
    vi_src: "Tăng đậm độ: máu cấp, u, xương, cản quang…; Giảm đậm độ: phù/nhồi máu, khí và u. Xuất huyết, tụ máu 55 – 75 HU; Chất xám 35 – 45; Chất trắng 20 – 30; Dịch não tủy 0 – 10"
    src: "yhoc8003:21719#1"
    en_open: "Describe the lesion: its lobe and side, size, and whether it is hyperdense, isodense or hypodense to brain."
    en_yn: "Is the lesion hyperdense?"

  # ═════════════ MRI SỌ NÃO (SUY RA) ═════════════
  - id: hm.t.seq
    node: hm
    tier: 1
    vi_src: "Tín hiệu các mô dịch cơ thể: Nước tự do (thận, phù, dịch não tủy) — T1W: Thấp, T2W: Cao; Mỡ — T1W: Cao, T2W: Cao"
    src: "lectures:14738#3"
    en_open: "Is the cerebrospinal fluid dark or bright on this image — does it look T1-weighted, T2-weighted, FLAIR or diffusion-weighted?"
    en_yn: "Is the cerebrospinal fluid bright on this image?"
  - id: hm.t.plane
    node: hm
    tier: 1
    vi_src: "So sánh CT và MRI — Mặt cắt: CT Axial, Coronal; MRI Bất kỳ"
    src: "lectures:14738#4"
    en_open: "In which plane is this MRI slice (axial, coronal or sagittal)?"
    en_yn: "Is this an axial MRI slice?"
  - id: hm.t.asym
    node: hm
    tier: 1
    vi_src: "'A' – Asymetry – so sánh hai bên (áp dụng từ ABBCS của CT đầu)"
    src: "yhoc8003:21719#1"
    en_open: "Comparing the two hemispheres, is the signal symmetric, or is one side abnormal?"
    en_yn: "Is there a signal asymmetry between the two hemispheres?"
  - id: hm.s.par
    node: hm.par
    tier: 2
    vi_src: "'B' – Brain — Bất thường (đậm độ → tín hiệu); Sự phân biệt chất xám/trắng"
    src: "yhoc8003:21719#1"
    en_open: "Is the brain parenchyma normal in signal, with preserved grey–white differentiation?"
    en_yn: "Is there abnormal signal in the brain parenchyma?"
  - id: hm.s.mid
    node: hm.mid
    tier: 2
    vi_src: "Di lệch: Sự đẩy lệch Đường giữa; Cấu trúc đường giữa như liềm não, tuyến yên, tuyến tùng"
    src: "yhoc8003:21719#1"
    en_open: "Are the midline structures in their normal position?"
    en_yn: "Are the midline structures displaced?"
  - id: hm.s.csf
    node: hm.csf
    tier: 2
    vi_src: "'C' – CSF spaces — Đánh giá kích thước não thất và rãnh não"
    src: "yhoc8003:21719#1"
    en_open: "Are the ventricles and sulci normal in size?"
    en_yn: "Are the ventricles enlarged?"
  - id: hm.f.focal
    node: hm.par.focal
    tier: 3
    vi_src: "MRI … có thể phát hiện nhồi máu tốt hơn NCCT; T1WI, T2WI, FLAIR, Diffusion weighted image (DWI)"
    src: "lectures:15498#1"
    en_open: "Is there a focal area of abnormal signal on this image, and is it hyperintense or hypointense?"
    en_yn: "Is there a focal hyperintense lesion on this image?"
  - id: hm.f.bleed
    node: hm.par.bleed
    tier: 3
    vi_src: "Tín hiệu xuất huyết (tùy thuộc vào thời gian): Tối cấp (< 24 giờ) — T1W Thấp, T2W Cao; Cấp (1-3 ngày)…"
    src: "lectures:14738#3"
    en_open: "Does the lesion have the signal pattern of haemorrhage on this image?"
    en_yn: "Does the lesion look like haemorrhage on this image?"
  - id: hm.f.shift
    node: hm.mid.shift
    tier: 3
    vi_src: "Hiệu ứng choán chỗ: ép não thất, rãnh…; Sự đẩy lệch Đường giữa"
    src: "lectures:14262#2"
    en_open: "Does the lesion cause mass effect, compressing a ventricle or shifting the midline?"
    en_yn: "Does the lesion cause mass effect?"
  - id: hm.f.hydro
    node: hm.csf.hydro
    tier: 3
    vi_src: "Tìm bất đối xứng khoang dịch não tủy như xóa sừng trán hoặc mất rãnh não gợi ý phù"
    src: "yhoc8003:21719#1"
    en_open: "Are the ventricles dilated, or are the sulci and a ventricular horn effaced?"
    en_yn: "Are the ventricles dilated?"
  - id: hm.d.lesion
    node: hm.desc
    tier: 3
    vi_src: "Vị trí, Kích thước, Hình dạng, Đường bờ, Cấu trúc bên trong, (đậm độ → tín hiệu), Liên quan cấu trúc xung quanh"
    src: "lectures:8244#3"
    en_open: "Describe the lesion: lobe and side, size, shape, margins and signal intensity on this image."
    en_yn: "Is the lesion well-defined?"

  # ═════════════ CT CỔ (SUY RA) ═════════════
  - id: nk.t.plane
    node: nk
    tier: 1
    vi_src: "Giải phẫu cắt lớp CT-MRI — Phần đầu-cổ (các lát cắt ngang vùng cổ)"
    src: "yhoc8003:21056#0"
