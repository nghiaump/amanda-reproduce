    en_open: "Is the gallbladder wall thickened, or are there gallstones?"
    en_yn: "Are there gallstones or gallbladder wall thickening?"
  - id: ab.f.panc
    node: ab.panc.inf
    tier: 3
    vi_src: "nhận định ống tụy, tĩnh mạch lách, mỡ quanh tụy"
