  - id: cc.f.int
    node: cc.lung.int
    tier: 3
    vi_src: "Cửa sổ phổi: … kén khí, xơ, các tổn thương mô kẽ"
    src: "lectures:8244#2"
    en_open: "Are there bullae, fibrosis or interstitial changes in the lungs?"
    en_yn: "Are there bullae, fibrosis or interstitial changes?"
  - id: cc.f.eff
    node: cc.pl.eff
    tier: 3
    vi_src: "Cửa sổ phổi: xem tràn khí màng phổi và trung thất"
    src: "lectures:8244#2"
    en_open: "Is there pleural fluid, pneumothorax or pneumomediastinum?"
    en_yn: "Is there a pleural effusion or pneumothorax?"
  - id: cc.f.pe
    node: cc.heart.pe
    tier: 3
    vi_src: "màng ngoài tim (TDMT), vôi hóa mạch vành"
    src: "lectures:8244#2"
    en_open: "Is there a pericardial effusion or coronary artery calcification?"
    en_yn: "Is there a pericardial effusion?"
  - id: cc.f.an
    node: cc.vess.an
    tier: 3
    vi_src: "ĐMC, ĐM phổi, các nhánh (hẹp/ phình, bóc tách…)"
    src: "lectures:8244#2"
    en_open: "Is there stenosis, aneurysm or dissection of the aorta or pulmonary arteries?"
    en_yn: "Is there an aortic aneurysm or dissection?"
  - id: cc.f.lysis
