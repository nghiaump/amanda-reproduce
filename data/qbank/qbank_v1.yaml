    tier: 3
    vi_src: "Cửa sổ xương: thấy rõ hơn hình ảnh hủy xương"
    src: "lectures:8244#2"
    en_open: "Is there any lytic or destructive bone lesion?"
    en_yn: "Is there a lytic bone lesion?"
