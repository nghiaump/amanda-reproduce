    tier: 2
    vi_src: "Dạ dày: vị trí, độ căng, dày thành; Tá tràng, ruột non: vị trí, độ căng, độ dày thành, mỡ xung quanh; Đại–trực tràng: vị trí, độ căng, độ dày thành, lòng ruột"
