questions:
  # ═════════════ X-QUANG NGỰC ═════════════
  # tầng 1 — kỹ thuật & quan sát chung
  - id: xc.t.proj
    node: xc
    tier: 1
    vi_src: "Đọc các tiêu chuẩn kỹ thuật — Phim đứng/nằm (PA/AP)"
    src: "bsnt:2755#0"
    en_open: "Is this chest radiograph an upright PA film or a supine AP film?"
    en_yn: "Is this chest radiograph an upright PA film?"
  - id: xc.t.insp
    node: xc
    tier: 1
    vi_src: "HÍT ĐỦ SÂU — Cung sườn 9 sau, cung sườn 6 trước nằm trên cơ hoành"
    src: "lectures:11747#0"
    en_open: "How many posterior ribs are visible above the right hemidiaphragm — is inspiration adequate?"
    en_yn: "Is inspiration adequate, with about nine posterior ribs visible above the diaphragm?"
  - id: xc.t.rot
    node: xc
    tier: 1
    vi_src: "Thẳng hay xoay: Đường nối các gai sống; Vị trí khớp ức đòn"
    src: "lectures:11334#0"
    en_open: "Are the spinous processes centred between the medial ends of the clavicles, or is the patient rotated?"
    en_yn: "Is the patient rotated on this film?"
  - id: xc.t.pen
    node: xc
    tier: 1
    vi_src: "Cường độ tia: thấy rõ 4 đốt sống ngực đầu tiên; Tia quá mềm không thấy chi tiết trong trung thất, tia quá cứng không thấy chi tiết trong nhu mô"
    src: "lectures:11334#0"
    also: ["lectures:11747#0"]
    en_open: "Is the exposure adequate — are the upper thoracic vertebrae seen through the mediastinum without losing lung detail?"
    en_yn: "Is the exposure (penetration) of this film adequate?"
  - id: xc.t.situs
    node: xc
    tier: 1
    vi_src: "Situs solitus/inversus"
    src: "bsnt:2755#0"
    en_open: "Are the cardiac apex, aortic arch and gastric air bubble on the left side (situs solitus)?"
    en_yn: "Are the cardiac apex, aortic arch and gastric air bubble on the left side?"
  - id: xc.t.overall
    node: xc
    tier: 1
    vi_src: "Nhận diện được các cấu trúc giải phẫu bình thường (nêu các vùng không bệnh lý)"
    src: "bsnt:2755#0"
    en_open: "Which regions of this chest radiograph look normal, and which region looks abnormal?"
    en_yn: "Is there any visible abnormality on this chest radiograph?"

  # tầng 2 — trình tự giải phẫu ABCDEF
  - id: xc.s.A
    node: xc.A
    tier: 2
    vi_src: "A: Airways — Quan sát: Khí quản, Phế quản gốc 2 bên, Carina. Chú ý 2 bất thường: Di lệch – Hẹp"
    src: "lectures:10925#1"
    en_open: "Is the trachea midline, and are the carina and main bronchi normal, displaced or narrowed?"
    en_yn: "Is the trachea deviated from the midline?"
  - id: xc.s.B
    node: xc.B
    tier: 2
    vi_src: "B: Breathing (2 phế trường – Rốn phổi). Quan sát 2 phế trường: Hình sáng; Hình mờ"
    src: "lectures:10925#1"
    en_open: "Comparing both lung fields, is there any abnormal lucency or opacity, and on which side?"
    en_yn: "Is there an abnormal opacity or lucency in either lung field?"
  - id: xc.s.H
    node: xc.H
    tier: 2
    vi_src: "Rốn phổi P thường thấp hơn rốn phổi T # 1,5cm. Quan sát: Vị trí, Kích thước, Di lệch"
    src: "lectures:10925#3"
    en_open: "Are both hila normal in position and size?"
    en_yn: "Is either hilum enlarged or displaced?"
  - id: xc.s.P
    node: xc.P
    tier: 2
    vi_src: "Cơ hoành, màng phổi"
    src: "bsnt:2755#0"
    en_open: "Is the pleural outline along both lungs normal?"
    en_yn: "Is there a visible pleural abnormality?"
  - id: xc.s.C
    node: xc.C
    tier: 2
    vi_src: "C: Cardiovascular (Tim mạch) — Kích thước bóng tim; Các cung T, cung P của bóng tim"
    src: "lectures:10925#3"
    en_open: "What are the size and shape of the cardiac silhouette?"
    en_yn: "Is the cardiac silhouette abnormal in size or shape?"
  - id: xc.s.M
    node: xc.M
    tier: 2
    vi_src: "Trung thất, bóng tim"
    src: "bsnt:2755#0"
    en_open: "Is the mediastinum normal in width and position?"
    en_yn: "Is the mediastinum widened or shifted?"
  - id: xc.s.D
    node: xc.D
    tier: 2
    vi_src: "D: Diaphragm — Quan sát các góc sườn hoành, tâm hoành; Độ cong và vị trí của cơ hoành 2 bên; Bóng hơi dạ dày dưới cơ hoành"
    src: "lectures:10925#4"
    en_open: "Are both costophrenic angles sharp, and are the hemidiaphragms normal in position and contour?"
    en_yn: "Is either costophrenic angle blunted?"
  - id: xc.s.E
    node: xc.E
    tier: 2
    vi_src: "E: Else (Xương, phần mềm) — Các cung xương sườn 2 bên, Xương đòn, Xương bả vai, Xương cánh tay; Phần mềm: Tuyến vú, Cơ, Mô mềm ở ngực"
    src: "lectures:10925#4"
    en_open: "Are the ribs, clavicles, scapulae and chest-wall soft tissues normal?"
    en_yn: "Is there an abnormality of the ribs, clavicles or chest-wall soft tissues?"
  - id: xc.s.F
    node: xc.F
    tier: 2
    vi_src: "F: Foreign objects (Ngoại vật) — Máy tạo nhịp tim"
    src: "lectures:10925#4"
    en_open: "Are any tubes, lines, pacemakers or other foreign bodies visible?"
    en_yn: "Is any medical device or foreign body visible?"

  # tầng 3 — dấu hiệu chi tiết
  - id: xc.f.lucent
    node: xc.B.lucent
    tier: 3
    vi_src: "Hình sáng: Tràn khí màng phổi, kén khí, khí phế thủng"
    src: "lectures:10925#1"
    en_open: "Is there an area of increased lucency without lung markings (pneumothorax, bulla) or diffuse hyperlucency (emphysema)?"
    en_yn: "Is there an area of abnormal lucency without lung markings?"
  - id: xc.f.homog
    node: xc.B.homog
    tier: 3
    vi_src: "Hình mờ đồng nhất: Xẹp phổi (lõm vào trong, kéo lệch khí quản và/hoặc bóng tim về phía xẹp); Tràn dịch màng phổi (đẩy lệch khí quản và bóng tim về phía đối bên)"
    src: "lectures:10925#1"
    en_open: "Is there a homogeneous opacity, and does it pull the trachea and heart toward it (collapse) or push them away (effusion)?"
    en_yn: "Is there a homogeneous opacity in either hemithorax?"
  - id: xc.f.alveolar
    node: xc.B.alveolar
    tier: 3
    vi_src: "Hình mờ dạng phế nang: giới hạn không rõ, thường phân bố theo thùy hoặc phân thùy, có thể có air-bronchogram"
    src: "lectures:10925#2"
    en_open: "Is there an ill-defined airspace opacity in a lobar or segmental distribution, with air bronchograms?"
    en_yn: "Is there an airspace opacity with air bronchograms?"
  - id: xc.f.silh
    node: xc.B.silh
    tier: 3
    vi_src: "Silhouette sign (+): Không nhìn thấy được giới hạn của các cơ quan trong lồng ngực nằm cạnh bên do có cùng đậm độ"
    src: "lectures:10925#2"
    en_open: "Does the opacity obscure the adjacent heart border or hemidiaphragm (silhouette sign), and which lobe does that point to?"
    en_yn: "Does the opacity obscure the adjacent heart border or hemidiaphragm?"
  - id: xc.f.inter
    node: xc.B.inter
    tier: 3
    vi_src: "Hình mờ dạng mô kẽ: không phân bố theo thùy, phân thùy; giới hạn rõ; không có air-bronchogram; hình lưới, nốt và lưới – nốt"
    src: "lectures:10925#2"
    en_open: "Is there a diffuse reticular, nodular or reticulonodular (interstitial) pattern in both lungs?"
    en_yn: "Is there a diffuse reticular or nodular pattern in the lungs?"
  - id: xc.f.nodule
    node: xc.B.nodule
    tier: 3
    vi_src: "NỐT PHỔI - U PHỔI: Hình mờ dạng tròn giới hạn rõ; Nốt phổi: 2R < 3cm; U phổi: 2R > 3cm"
    src: "lectures:10925#3"
    en_open: "Is there a well-defined round opacity, and is it a nodule (under 3 cm) or a mass (over 3 cm)?"
    en_yn: "Is there a round nodule or mass in the lungs?"
  - id: xc.f.cavity
    node: xc.B.cavity
    tier: 3
    vi_src: "Abces phổi: Hình mờ dạng tròn, khu trú, bên trong sáng, giới hạn khá rõ, thường có mức khí – dịch. Hang lao: không có mực khí – dịch"
    src: "lectures:10925#3"
    en_open: "Does the focal opacity contain air (a cavity), and is there an air–fluid level inside it?"
    en_yn: "Is there a cavity with an air-fluid level?"
  - id: xc.f.edema
    node: xc.B.edema
    tier: 3
    vi_src: "PHÙ PHỔI: Hình mờ không đồng nhất lan tỏa 2 phế trường, giới hạn không rõ, thường có hình cánh dơi. Phù phổi do tim: Đường Kerley B"
    src: "lectures:10925#2"
    en_open: "Is there a bilateral perihilar 'bat-wing' opacity or Kerley B lines?"
    en_yn: "Is there a bilateral perihilar bat-wing opacity?"
  - id: xc.f.eff
    node: xc.P.eff
    tier: 3
    vi_src: "TDMP vừa hoặc ít: Hình mờ đồng nhất ở đáy phổi làm mất góc sườn hoành và có giới hạn trên là đường cong Damoiseau"
    src: "lectures:10925#2"
    en_open: "Is there a homogeneous basal opacity with a curved upper border (meniscus) that blunts the costophrenic angle?"
    en_yn: "Is there a pleural effusion blunting the costophrenic angle?"
  - id: xc.f.ptx
    node: xc.P.ptx
    tier: 3
    vi_src: "TRÀN KHÍ MÀNG PHỔI: Đường viền màu trắng của màng phổi tạng do sự tương phản của khí và mô phổi; Không thấy mạch máu ở vùng tràn khí"
    src: "lectures:11747#1"
    en_open: "Is a visceral pleural line visible with no lung markings beyond it?"
    en_yn: "Is there a pneumothorax?"
  - id: xc.f.ctr
    node: xc.C.size
    tier: 3
    vi_src: "Kích thước bóng tim: Chiều ngang lớn nhất bóng tim < 0,5 chiều ngang lớn nhất lồng ngực. Lưu ý chỉ đo trên phim PA"
    src: "lectures:10925#3"
    en_open: "Is the cardiothoracic ratio greater than 0.5?"
    en_yn: "Is the cardiothoracic ratio greater than 0.5?"
  - id: xc.f.arcs
    node: xc.C.arcs
    tier: 3
    vi_src: "Các cung T của bóng tim; Các cung P của bóng tim; Phồng cung động mạch phổi"
    src: "lectures:10925#3"
    en_open: "Are the left and right heart borders normal, or is any cardiac arc (e.g. the pulmonary artery) bulging?"
    en_yn: "Is any cardiac arc abnormally prominent?"
  - id: xc.f.mmass
    node: xc.M.mass
    tier: 3
    vi_src: "Trung thất trước: U quái, U tuyến ức, Tuyến giáp thòng, Lymphoma; Trung thất giữa: Hạch to…; Trung thất sau: U thần kinh…"
    src: "lectures:11747#3"
    en_open: "Is there a mediastinal mass, and is it in the anterior, middle or posterior mediastinum?"
    en_yn: "Is there a mediastinal mass?"
  - id: xc.f.shift
    node: xc.M.shift
    tier: 3
    vi_src: "Xẹp phổi … có thể kéo lệch khí quản và/hoặc bóng tim về phía xẹp phổi; Tràn dịch màng phổi … thường đẩy lệch khí quản và bóng tim về phía đối bên"
    src: "lectures:10925#1"
    en_open: "Toward which side are the trachea and heart shifted?"
    en_yn: "Are the trachea and heart shifted to one side?"
  - id: xc.f.freeair
    node: xc.D.freeair
    tier: 3
    vi_src: "Liềm hơi dưới cơ hoành — Chỉ thấy khi chụp tư thế đứng hoặc ngồi — Dấu hiệu thủng tạng rỗng"
    src: "lectures:10925#4"
    en_open: "Is there a crescent of free air under either hemidiaphragm?"
    en_yn: "Is there free air under the diaphragm?"
  - id: xc.f.flat
    node: xc.D.flat
    tier: 3
    vi_src: "Cơ hoành dẹt. Gặp trong Khí phế thủng (đều 2 bên)…"
    src: "lectures:10925#4"
    en_open: "Are the hemidiaphragms flattened?"
    en_yn: "Are the hemidiaphragms flattened?"
  - id: xc.f.bone
    node: xc.E.bone
    tier: 3
    vi_src: "Xương — Các bất thường: Gãy xương; Xương biến dạng hoặc di lệch; Hủy xương"
    src: "lectures:10925#4"
    en_open: "Is there a rib fracture, bone deformity or bone destruction?"
    en_yn: "Is there a fracture or bone destruction?"
  - id: xc.f.sce
    node: xc.E.sce
    tier: 3
    vi_src: "TRÀN KHÍ DƯỚI DA — Chú ý khi bệnh nhân có TKMP, TK trung thất, hoặc sau thủ thuật"
    src: "lectures:11747#1"
    en_open: "Is there subcutaneous emphysema in the chest wall?"
    en_yn: "Is there subcutaneous emphysema in the chest wall?"
  - id: xc.d.lesion
    node: xc.desc
    tier: 3
    vi_src: "Mô tả các hình ảnh bất thường theo đậm độ và hội chứng — Hình sáng / Hình mờ: vị trí, phân bố, đường bờ, kích thước…"
    src: "bsnt:2755#0"
    en_open: "Describe the abnormality: its side and zone, distribution, margins and approximate size."
    en_yn: "Is the abnormality well-defined?"

  # ═════════════ CT NGỰC ═════════════
  - id: cc.t.window
    node: cc
