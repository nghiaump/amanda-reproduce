  # ───────────── X-quang ngực ─────────────
  - {id: xc, type: root, route: xray_chest, en: "chest radiograph"}
  - {id: xc.A,  type: structure, parent: xc, en: "airways (trachea, carina, main bronchi)"}
  - {id: xc.B,  type: structure, parent: xc, en: "both lung fields"}
