    en_yn: "Is there a bone abnormality?"
  - id: ab.f.liver
    node: ab.liver.les
    tier: 3
    vi_src: "Xác định được gan, nhận xét đậm độ"
    src: "lectures:14709#0"
    en_open: "Is there a focal liver lesion, and is it hypodense, isodense or hyperdense to the liver?"
