    en_open: "Are the stomach, small bowel and colon normal in position, distension and wall thickness?"
    en_yn: "Is any part of the bowel abnormal?"
  - id: ab.s.pelvis
    node: ab.pelvis
    tier: 2
    vi_src: "Bàng quang: độ căng, độ dày thành, lòng; Tử cung, buồng trứng: kích thước, vị trí, khối u; Tuyến tiền liệt và túi tinh: kích thước, đóng vôi"
    src: "lectures:9222#1"
    en_open: "Are the bladder and pelvic organs (uterus/ovaries or prostate) normal?"
    en_yn: "Is there an abnormality of the bladder or pelvic organs?"
  - id: ab.s.vess
    node: ab.vess
    tier: 2
    vi_src: "Mạch máu: ĐMCB, TMCD, ĐM thân tạng, đ-tm MTTT, đ-tm MTTD, đ-tm thận, tm lách, tm cửa"
