    tier: 2
    vi_src: "Tụy: kích thước, vị trí, đầu, cổ, thân, đuôi tụy; nhận định ống tụy, tĩnh mạch lách, mỡ quanh tụy"
    src: "lectures:9222#1"
    en_open: "Is the pancreas (head, body, tail) normal in size and outline?"
    en_yn: "Is the pancreas abnormal?"
  - id: ab.s.kid
    node: ab.kid
    tier: 2
    vi_src: "Thận: kích thước, bắt thuốc đối xứng, ứ các đài, bể thận và niệu quản; vị trí và hướng của thận. Thượng thận: dạng Y hay V"
    src: "lectures:9222#2"
    en_open: "Are both kidneys and adrenal glands normal in size, position and enhancement?"
    en_yn: "Is either kidney or adrenal gland abnormal?"
  - id: ab.s.bowel
