    tier: 3
    vi_src: "Liên quan cấu trúc xung quanh (… xâm lấn mạch máu…)"
    src: "lectures:8244#3"
    en_open: "Is there a neck mass or enlarged node, and does it invade adjacent vessels or the airway?"
    en_yn: "Is there a neck mass?"
  - id: nk.d.lesion
    node: nk.desc
    tier: 3
    vi_src: "CÁCH MÔ TẢ TỔN THƯƠNG: Vị trí, Kích thước, Hình dạng, Đường bờ, Cấu trúc bên trong, Đậm độ, Liên quan cấu trúc xung quanh"
    src: "lectures:8244#3"
    en_open: "Describe the lesion: location, size, shape, margins, internal structure, density and relation to surrounding structures."
    en_yn: "Is the lesion well-defined?"

  # ═════════════ GENERIC ═════════════
  - id: gn.t.mod
