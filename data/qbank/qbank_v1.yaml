    src: "lectures:8244#2"
    en_open: "Are the carotid arteries and jugular veins normal?"
    en_yn: "Is a neck vessel abnormal?"
  - id: nk.s.soft
    node: nk.soft
    tier: 2
    vi_src: "Hạch; Thành ngực: mô mềm (áp dụng cho mô mềm vùng cổ)"
    src: "lectures:8244#2"
    en_open: "Are the soft tissues and lymph nodes of the neck normal?"
    en_yn: "Are there enlarged lymph nodes or a soft-tissue mass in the neck?"
  - id: nk.s.spine
    node: nk.spine
    tier: 2
    vi_src: "Cửa sổ xương: thấy rõ hơn hình ảnh hủy xương, chi tiết xương"
    src: "lectures:8244#2"
    en_open: "Is the cervical spine normal?"
    en_yn: "Is there an abnormality of the cervical spine?"
  - id: nk.f.air
    node: nk.air.dev
    tier: 3
    vi_src: "A: Airways — Chú ý 2 bất thường: Di lệch – Hẹp"
    src: "lectures:10925#1"
    en_open: "Is the airway displaced or narrowed by an adjacent mass?"
    en_yn: "Is the airway displaced or narrowed?"
  - id: nk.f.mass
